{% load static %}
<aside class="w-72 bg-white dark:bg-surface-dark border-l border-slate-200 dark:border-slate-700 hidden lg:flex flex-col z-20 shadow-sm transition-colors duration-300" data-admin-sidebar>
    <div class="h-20 flex items-center gap-3 px-6 border-b border-slate-100 dark:border-slate-700/50">
        <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/30 rounded-xl flex items-center justify-center text-primary shrink-0">
            <span class="material-symbols-rounded">psychology</span>
        </div>
        <div class="flex flex-col">
            <span class="text-lg font-extrabold text-slate-900 dark:text-white leading-none">منصة الاختبارات</span>
            <span class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">لوحة المشرف</span>
        </div>
    </div>
    <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
        <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-slate-200 rounded-xl transition-colors font-medium group" href="{% url 'admin_dashboard' %}">
            <span class="material-symbols-rounded group-hover:text-primary transition-colors">dashboard</span>
            <span>لوحة التحكم</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-slate-200 rounded-xl transition-colors font-medium group" href="{% url 'admin_users' %}">
            <span class="material-symbols-rounded group-hover:text-primary transition-colors">manage_accounts</span>
            <span>ادارة المستخدمين</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-slate-200 rounded-xl transition-colors font-medium group" href="{% url 'admin_teachers' %}">
            <span class="material-symbols-rounded group-hover:text-primary transition-colors">school</span>
            <span>المدرسين</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-slate-200 rounded-xl transition-colors font-medium group" href="{% url 'admin_groups' %}">
            <span class="material-symbols-rounded group-hover:text-primary transition-colors">groups</span>
            <span>المجموعات</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-3 {% if request.resolver_match.url_name == 'admin_exams' or request.resolver_match.url_name == 'admin_exam_monitor' or request.resolver_match.url_name == 'admin_exam_results' or request.resolver_match.url_name == 'admin_exam_details' %}bg-primary/10 text-primary font-bold shadow-sm ring-1 ring-primary/20{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-slate-200 font-medium group{% endif %} rounded-xl transition-all" href="{% url 'admin_exams' %}">
            <span class="material-symbols-rounded {% if request.resolver_match.url_name != 'admin_exams' and request.resolver_match.url_name != 'admin_exam_monitor' and request.resolver_match.url_name != 'admin_exam_results' and request.resolver_match.url_name != 'admin_exam_details' %}group-hover:text-primary transition-colors{% endif %}">quiz</span>
            <span>الاختبارات</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-slate-200 rounded-xl transition-colors font-medium group" href="{% url 'admin_analytics' %}">
            <span class="material-symbols-rounded group-hover:text-primary transition-colors">analytics</span>
            <span>التحليلات والتقارير</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-slate-200 rounded-xl transition-colors font-medium group" href="{% url 'admin_settings' %}">
            <span class="material-symbols-rounded group-hover:text-primary transition-colors">settings</span>
            <span>الإعدادات العامة</span>
        </a>
    </nav>
    <div class="p-4 border-t border-slate-100 dark:border-slate-700/50">
        <form method="post" action="{% url 'logout' %}" class="flex items-center gap-3 w-full">
            {% csrf_token %}
            <button type="submit" class="flex items-center gap-3 w-full p-2.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 rounded-xl transition-colors text-right group">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-blue-400 flex items-center justify-center text-white font-bold shadow-md shrink-0">
                    {{ request.user.full_name|default:"م.أ"|slice:":2" }}
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="text-sm font-bold text-slate-900 dark:text-white truncate">{{ request.user.full_name|default:request.user.username }}</div>
                    <div class="text-xs text-slate-500 dark:text-slate-400 truncate group-hover:text-primary transition-colors">مدير النظام</div>
                </div>
                <span class="material-symbols-rounded text-slate-400 group-hover:text-red-500 transition-colors">logout</span>
            </button>
        </form>
    </div>
</aside>
