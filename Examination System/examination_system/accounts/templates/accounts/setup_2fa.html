{% extends 'base.html' %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center;">
    <h1 style="font-size: 2rem; margin-bottom: 1rem;">إعداد المصادقة الثنائية (2FA)</h1>
    <p style="margin-bottom: 2rem; color: #666;">قم بمسح رمز الاستجابة السريعة أدناه باستخدام تطبيق المصادقة الخاص بك.</p>
    
    <div style="background: #f0f0f0; padding: 2rem; border-radius: 1rem; margin-bottom: 2rem;">
        <!-- Placeholder QR Code -->
        <div style="width: 200px; height: 200px; background: #ddd; display: flex; align-items: center; justify-content: center;">
            QR Code Placeholder
        </div>
    </div>
    
    <form action="{% url 'home' %}" method="get">
        <button type="submit" style="background-color: #2563EB; color: white; padding: 0.75rem 2rem; border: none; border-radius: 0.5rem; cursor: pointer;">
            إتمام الإعداد والمتابعة
        </button>
    </form>
</div>
{% endblock %}
